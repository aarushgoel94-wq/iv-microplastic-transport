# parameters.yaml — single source of truth for the paper figures
# Regenerate all deliverables:  python regenerate_paper_figures.py

experiment:
  seed: 42
  base_trials_per_size: 50
  n_replicates: 20          # Tier 1.1 — independent campaigns for mean ± s.d.
  max_time_s: 20.0
  fast_mode: true
  diameters_um: [3.0, 10.0, 50.0]

tube:
  length_m: 0.100
  width_m: 0.004

fluid:
  density_kg_m3: 1000.0
  dynamic_viscosity_pa_s: 0.001
  # Rapid / gravity-bolus infusion (~2260 mL/hr through 4 mm bore), NOT maintenance 100–125 mL/hr
  average_velocity_m_s: 0.05
  scenario_label: "rapid / gravity-bolus infusion (~2260 mL/hr)"
  temperature_k: 310.0

particle:
  density_kg_m3: 905.0   # polypropylene
  gravity_m_s2: 9.81

clinical_realism:
  enabled: true
  static_rate_near_wall_per_s: 0.18
  static_rate_bulk_per_s: 0.0          # Tier 0.3 — deleted (was indefensible)
  near_wall_band_m: 0.00030            # gates BOTH static and defect snags (Tier 0.2)
  defect_density_per_m: 28.0
  defect_capture_prob: 0.028
  defect_capture_width_m: 0.0006
  connector_rate_multiplier: 3.0
  focus_enabled: true                  # set false for ablation (Tier 0.4)
  focus_efficiency: 0.88               # α_eff = focus_efficiency × (1 − e^(−λ dt))
  use_brownian_kick: true              # Tier 1.4 — Stokes–Einstein √(2DΔt)
  size_snag_exponent: 0.35             # empirical; sensitivity in [0,1] (Tier 1.3)
  degraded_tubing_multiplier: 1.75
  paired_defect_layout: true           # Tier 1.2

phi_sweep:                             # Tier 2.1
  phi_deg: [1.0, 1.5, 2.0, 2.5, 3.0]
  phi_wall: [1.0, 1.5, 1.75, 2.0, 2.5]
  base_trials: 30

software:
  primary_script: microplastic_simulation.py
  regenerate_command: "python regenerate_paper_figures.py"
  colab_status: "archived — see archive/Microplastic_Simulation_Colab.ipynb.DEPRECATED"
